name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tests gate the deploy: a schema break or a store regression stops here.
      - run: pnpm test

      - run: pnpm -r build

      - name: Assemble site
        run: |
          rm -rf deploy
          mkdir deploy
          cp -r apps/restaurants/dist deploy/restaurants
          cp -r apps/budget/dist deploy/budget
          cp -r apps/budget-meat/dist deploy/budget-meat
          cp -r apps/bakeries/dist deploy/bakeries
          cp -r apps/top-100/dist deploy/top-100
          cp -r site/* deploy/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
